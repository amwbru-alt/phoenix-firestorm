name: ForMe viewer policy and badges
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute production policy tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iindra/llcommon tests/forme/grid_policy_test.cpp -o "$RUNNER_TEMP/grid-policy-test"
          "$RUNNER_TEMP/grid-policy-test"
      - name: Check grid boundaries and all shipped preference skins
        run: python3 tests/forme/check_grid_integration.py
      - name: Compile and execute production badge parser tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iindra/llcommon tests/forme/avatar_badge_test.cpp -o "$RUNNER_TEMP/avatar-badge-test"
          "$RUNNER_TEMP/avatar-badge-test"
      - name: Check badge integration and interface branding
        run: |
          python3 tests/forme/check_badge_integration.py
          python3 tests/forme/test_branding.py
          python3 tests/forme/test_packaging_branding.py
          python3 tests/forme/branding.py --check
      - name: Compile and execute creator access policy tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iindra/llcommon tests/forme/creator_policy_test.cpp -o "$RUNNER_TEMP/creator-policy-test"
          "$RUNNER_TEMP/creator-policy-test"
      - name: Check creator-only actions and all shipped UI skins
        run: |
          python3 tests/forme/check_creator_integration.py
          python3 tests/forme/creator_ui.py --check
      - name: Check native ForMe marketplace integration
        run: python3 tests/forme/check_marketplace_listings.py
      - name: Verify fmw links and removed client features
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iindra/llcommon tests/forme/url_policy_test.cpp -o "$RUNNER_TEMP/fmw-url-test"
          "$RUNNER_TEMP/fmw-url-test"
          python3 tests/forme/check_removed_features.py
      - name: Check own viewer data service and remove vendor dependencies
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic -Iindra/llcommon tests/forme/viewer_data_test.cpp -o "$RUNNER_TEMP/viewer-data-test"
          "$RUNNER_TEMP/viewer-data-test"
          python3 tests/forme/check_viewer_data.py
