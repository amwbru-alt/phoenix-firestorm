repos:
  - repo: https://github.com/secondlife/git-hooks.git
    rev: v1.0.2
    hooks:
      - id: llsd
      - id: no-trigraphs
      - id: end-of-file
        files: \.(cpp|c|m|mm|h|py|glsl|cmake|txt)$
        exclude: language.txt
      - id: indent-with-spaces
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake|yaml|sh)$
  - repo: local
    hooks:
      - id: opensource-license
        name: Check Firestorm and standard opensource notices
        entry: python3 scripts/forme_check_license.py
        language: system
        files: \.(?:cpp|c|h|py|glsl)$
